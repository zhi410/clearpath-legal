    <stop offset="0.5" stop-color="#F4C95D"/>
    <stop offset="1" stop-color="#E9B441"/>
  </linearGradient>
  <radialGradient id="a_starGlow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#FFF6D8" stop-opacity="0.55"/>
    <stop offset="1" stop-color="#FFF6D8" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="a_cloudClip">
    <path d="M 310 728 C 240 728 190 680 190 616 C 190 556 238 510 298 508 C 304 436 364 384 438 384 C 470 384 498 394 520 410 C 548 350 610 318 672 334 C 744 352 786 420 776 492 C 806 500 834 540 834 590 C 834 668 776 728 704 728 C 600 738 420 738 310 728 Z"/>
  </clipPath>
  <clipPath id="a_mouthClip">
    <path d="M 486 598 A 26 26 0 0 0 538 598 Z"/>
  </clipPath>
</defs>
  <g id="a_mascot">
