<svg xmlns="http://www.w3.org/2000/svg" width="700" height="620" viewBox="162 140 700 620">
<defs>
  <linearGradient id="a_cloudFill" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="0.55" stop-color="#FDFBF7"/>
    <stop offset="1" stop-color="#F1EBDF"/>
  </linearGradient>
  <radialGradient id="a_innerShade" cx="0.5" cy="1" r="0.75">
    <stop offset="0" stop-color="#E4DCCC" stop-opacity="0.85"/>
    <stop offset="0.6" stop-color="#EDE6D8" stop-opacity="0.35"/>
    <stop offset="1" stop-color="#FDFBF7" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="a_blush" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#E88D67" stop-opacity="0.75"/>
    <stop offset="0.7" stop-color="#E88D67" stop-opacity="0.45"/>
    <stop offset="1" stop-color="#E88D67" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="a_starFill" x1="0" y1="0" x2="1" y2="1">
